# Site settings
title: "Nathan Jones - Lead Consulting Software Developer"
description: "Professional resume of Nathan Jones, Lead Consulting Software Developer with 15+ years of experience."

# Build settings
markdown: kramdown
sass:
  sass_dir: _sass
  style: compressed

# Resume settings
resume_avatar:                  "true"
resume_name:                    "Nathan Jones"
resume_title:                   "Lead Consulting Software Developer"

# used for the contact button in _layouts/resume.html
resume_contact_email:           "nate@drnatejones.com"

# the next two items are used for schema itemprops in _layouts/resume.html
resume_contact_telephone:       "+61 467 160 454"
resume_contact_address:         "Mandurah, WA"

resume_header_contact_info:     "Mandurah, WA • nate@drnatejones.com • +61 467 160 454"
display_header_contact_info:    "true"

resume_header_intro: "<p>I am passionate about coding and problem solving, with a particular enthusiasm for building clean, maintainable software. I thrive in collaborative environments, helping teams move efficiently and achieve their goals by leveraging Agile practices and Extreme Programming principles.</p><p>I enjoy breaking down complex problems into manageable solutions, mentoring colleagues, and fostering a culture of continuous improvement. Whether it's designing scalable architectures, writing robust code, or facilitating effective team processes, I aim to create value not only through technical excellence but also by enabling others to succeed.</p><p>I am motivated by challenges, constantly seeking opportunities to learn new technologies, experiment with innovative approaches, and contribute to projects that make a tangible impact.</p>"

# use "yes" to display the email contact button,
